name: Linux build

on:
  push:
  workflow_dispatch:

jobs:
  selftest:
    # Runs Airlock's checks in a real WebKitGTK web view on a virtual display.
    runs-on: ubuntu-24.04
    env:
      # GitHub's Ubuntu runners don't allow the user namespaces WebKit's own process sandbox needs
      # (on a desktop, and inside the Flatpak, the sandbox stays on). GTK_A11Y: no accessibility bus here.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, libadwaita and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 xvfb dbus-x11
      - name: Logic checks
        run: python3 -m airlock.logic_tests
      - name: Self-test (blocking in a real web view)
        run: xvfb-run -a dbus-run-session -- python3 -m airlock --selftest
      - name: Start the app for a few seconds
        run: |
          xvfb-run -a dbus-run-session -- timeout 15 python3 -m airlock > app.log 2>&1 || code=$?
          cat app.log
          # 124 = still running when the timer stopped it, which is what we want; any Python error fails the build.
          ! grep -q "Traceback" app.log
          test "${code:-0}" = "124" || test "${code:-0}" = "0"

  flatpak:
    # Plain flatpak-builder on the runner (the prebuilt container's runtime updates kept failing).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir com.vspayce.Airlock.json
          flatpak build-bundle repo airlock.flatpak com.vspayce.Airlock \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la airlock.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-x86_64.flatpak
          path: airlock.flatpak
          if-no-files-found: error

  release:
    # Puts the newest build on the Releases page, so it downloads from one fixed link:
    # https://github.com/vspayce/airlock-linux/releases/latest/download/airlock.flatpak
    needs: [selftest, flatpak]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: airlock-x86_64.flatpak
          path: out
      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          f=$(find out -name '*.flatpak' | head -1)
          cp "$f" airlock.flatpak
          tag="build-${{ github.run_number }}"
          gh release create "$tag" airlock.flatpak --target "${{ github.sha }}" --latest \
            --title "Airlock for Linux (build ${{ github.run_number }})" \
            --notes "Download airlock.flatpak, then double-click it (or run: flatpak install --user airlock.flatpak)."
